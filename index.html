<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя визитка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Привет, я Лиза</h1>
    <p>Начинающий веб-разработчик</p>
  </header>

  <main class="container">
    <section class="about">
      <img src="https://via.placeholder.com/200" alt="Моё фото" class="avatar">
      <div class="about-text">
        <h2>Обо мне</h2>
        <p>Я изучаю HTML, CSS и JavaScript. Люблю делать сайты и автоматизировать процессы.</p>
      </div>
    </section>

    <section class="counter-section">
      <h2>Счётчик кликов</h2>
      <p>Ты нажал: <span id="counter">0</span> раз</p>
      <button id="clickBtn" type="button">Нажми меня</button>
      <button id="themeBtn" type="button">Переключить тему</button>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Моя визитка</p>
  </footer>

  <script src="script.js"></script>
  <div>
</body>
</html>
